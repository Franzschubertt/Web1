<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabela</title>
  </head>
  <body>
    <!-- Tabela com borda e Lrgura de 50% da tela-->

      <!--Linha do Cabeçalho-->
      <tr>
        <th>Titulo Coluna 1</th>
        <th>Titulo Coluna 2</th>
        <th>Titulo Coluna 3</th>
      </tr>

      <tr>
        <td rowspan="3">Célula colunas 1,2 e 3</td>
        <td>Célula 1</td>
        <td>Célula 2</td>
      </tr>
      <tr>
        <td>Célula 3</td>
        <td>Célula 4</td>
      </tr>

      <tr>
        <td>Célula 5</td>
        <td>Célula 6</td>
      </tr>
    </table>
  </body>
</html>
